bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Proyecto Final - Métodos Estadísticos</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Publicado con Bookdown</a></li>
    edit: null
    download: ["pdf", "epub"]
    search: yes
    sharing:
      facebook: false
      twitter: false
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
